name: Test with Chrony NTP Server

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-library:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          cmake \
          libssl-dev \
          libmbedtls-dev \
          chrony \
          ntpdate
    
    - name: Configure Chrony
      run: |
        # Create temporary chrony config
        sudo tee /etc/chrony/chrony.conf > /dev/null <<EOF
        pool 2.debian.pool.ntp.org iburst
        pool time.google.com iburst
        driftfile /var/lib/chrony/drift
        makestep 1.0 3
        rtcsync
        local stratum 10
        allow 127.0.0.1
        allow ::1
        bindaddress 127.0.0.1
        bindaddress ::1
        EOF
    
    - name: Start Chrony NTP Server
      run: |
        sudo systemctl restart chrony
        sleep 3
        sudo chronyc tracking || true
        sudo chronyc sources || true
    
    - name: Clone FreeRTOS Kernel
      run: |
        git clone --depth 1 --branch V11.0.1 \
          https://github.com/FreeRTOS/FreeRTOS-Kernel.git \
          /tmp/FreeRTOS-Kernel
    
    - name: Clone FreeRTOS-Plus-TCP
      run: |
        git clone --depth 1 --branch V4.0.0 \
          https://github.com/FreeRTOS/FreeRTOS-Plus-TCP.git \
          /tmp/FreeRTOS-Plus-TCP
    
    - name: Build library with Make
      run: |
        make FREERTOS_PATH=/tmp/FreeRTOS-Kernel \
             FREERTOS_TCP_PATH=/tmp/FreeRTOS-Plus-TCP \
             FREERTOS_PORT=GCC/Posix
      
    - name: Build library with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DFREERTOS_KERNEL_PATH=/tmp/FreeRTOS-Kernel \
          -DFREERTOS_PLUS_TCP_PATH=/tmp/FreeRTOS-Plus-TCP \
          -DFREERTOS_PORT=GCC/Posix \
          -DBUILD_NTP_EXAMPLE=OFF
        make
    
    - name: Check library artifacts
      run: |
        ls -lh lib/libfreertos_ntp.a || ls -lh build/libfreertos_ntp.a
        echo "Library built successfully!"
    
    - name: Verify Chrony is running
      run: |
        echo "Testing NTP server availability..."
        ntpdate -q 127.0.0.1 || echo "NTP query test completed"
        sudo chronyc tracking
        sudo chronyc sources
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: freertos-ntp-library
        path: |
          lib/
          build/libfreertos_ntp.a
        retention-days: 7

  test-x86-example:
    runs-on: ubuntu-latest
    needs: test-library
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          cmake \
          libssl-dev \
          libmbedtls-dev \
          chrony \
          ntpdate
    
    - name: Configure and start Chrony
      run: |
        # Create temporary chrony config
        sudo tee /etc/chrony/chrony.conf > /dev/null <<EOF
        pool 2.debian.pool.ntp.org iburst maxdelay 0.1
        pool time.google.com iburst maxdelay 0.1
        driftfile /var/lib/chrony/drift
        makestep 1.0 3
        rtcsync
        local stratum 10
        allow 127.0.0.1
        allow ::1
        bindaddress 127.0.0.1
        bindaddress ::1
        logdir /var/log/chrony
        log measurements statistics tracking
        EOF
        
        sudo systemctl restart chrony
        sleep 5
        
        # Wait for chrony to sync
        for i in {1..30}; do
          if sudo chronyc tracking | grep -q "Leap status.*Normal"; then
            echo "Chrony synchronized successfully"
            break
          fi
          echo "Waiting for Chrony to sync... ($i/30)"
          sleep 2
        done
        
        sudo chronyc tracking
        sudo chronyc sources -v
    
    - name: Clone FreeRTOS dependencies
      run: |
        git clone --depth 1 --branch V11.0.1 \
          https://github.com/FreeRTOS/FreeRTOS-Kernel.git \
          /tmp/FreeRTOS-Kernel
        
        git clone --depth 1 --branch V4.0.0 \
          https://github.com/FreeRTOS/FreeRTOS-Plus-TCP.git \
          /tmp/FreeRTOS-Plus-TCP
    
    - name: Create CMakeLists.txt for x86 example
      run: |
        cat > examples/x86_test/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.13)
        project(freertos-ntp-x86-test C)
        
        # Source files
        set(EXAMPLE_SOURCES
            main.c
            ${FREERTOS_KERNEL_PATH}/tasks.c
            ${FREERTOS_KERNEL_PATH}/queue.c
            ${FREERTOS_KERNEL_PATH}/list.c
            ${FREERTOS_KERNEL_PATH}/timers.c
            ${FREERTOS_KERNEL_PATH}/event_groups.c
            ${FREERTOS_KERNEL_PATH}/stream_buffer.c
            ${FREERTOS_KERNEL_PATH}/portable/GCC/Posix/port.c
            ${FREERTOS_KERNEL_PATH}/portable/MemMang/heap_3.c
        )
        
        # Create executable
        add_executable(ntp_test ${EXAMPLE_SOURCES})
        
        # Include directories
        target_include_directories(ntp_test PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_SOURCE_DIR}/include
            ${FREERTOS_KERNEL_PATH}/include
            ${FREERTOS_KERNEL_PATH}/portable/GCC/Posix
            ${FREERTOS_PLUS_TCP_PATH}/include
            ${FREERTOS_PLUS_TCP_PATH}/portable/Compiler/GCC
        )
        
        # Link libraries
        target_link_libraries(ntp_test PRIVATE
            freertos_ntp
            pthread
            ssl
            crypto
        )
        
        # Compiler options
        target_compile_options(ntp_test PRIVATE
            -Wall
            -Wextra
            -pthread
            -DprojCOVERAGE_TEST=0
        )
        EOF
    
    - name: Build x86 example with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DFREERTOS_KERNEL_PATH=/tmp/FreeRTOS-Kernel \
          -DFREERTOS_PLUS_TCP_PATH=/tmp/FreeRTOS-Plus-TCP \
          -DFREERTOS_PORT=GCC/Posix \
          -DBUILD_NTP_EXAMPLE=ON
        make
        
        # Check if binary was created
        if [ -f examples/x86_test/ntp_test ]; then
          echo "✓ x86 test binary built successfully"
          ls -lh examples/x86_test/ntp_test
        else
          echo "✗ Failed to build x86 test binary"
          exit 1
        fi
    
    - name: Run x86 test with Chrony (timeout)
      run: |
        cd build/examples/x86_test
        
        # Run the test for max 30 seconds
        echo "Starting NTP test against local Chrony server..."
        timeout 30s ./ntp_test || EXIT_CODE=$?
        
        # Exit code 124 means timeout (expected for daemon-like behavior)
        # Exit code 0 means normal exit
        if [ "${EXIT_CODE:-0}" -eq 124 ]; then
          echo "✓ Test ran for 30 seconds (timeout - expected)"
        elif [ "${EXIT_CODE:-0}" -eq 0 ]; then
          echo "✓ Test completed successfully"
        else
          echo "✗ Test failed with exit code ${EXIT_CODE}"
          exit 1
        fi
    
    - name: Check Chrony statistics after test
      run: |
        echo "=== Chrony Statistics ==="
        sudo chronyc tracking
        sudo chronyc sources
        sudo chronyc serverstats || true
    
    - name: Upload test binary
      uses: actions/upload-artifact@v4
      with:
        name: ntp-test-binary
        path: build/examples/x86_test/ntp_test
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check formatting
      run: |
        echo "Checking code style..."
        # Add clang-format or other linting tools here
        find source include -name "*.c" -o -name "*.h" | wc -l
        echo "Found source files"
